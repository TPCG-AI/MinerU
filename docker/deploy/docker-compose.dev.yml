# ====================================
# MinerU 개발용 Docker Compose
# 로컬 소스 실시간 반영
# 사용법: docker compose -f docker-compose.dev.yml up
# ====================================

services:
  mineru-api:
    build:
      context: ../..
      dockerfile: docker/deploy/Dockerfile
    image: mineru-dev:latest
    container_name: mineru-dev-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_TOOLS_CONFIG_JSON: /app/mineru.json
      PORT: 8080
    volumes:
      # 로컬 소스 코드 실시간 반영 (editable mode)
      - ../../mineru:/workspace/mineru/mineru:rw
      # GCS 버킷은 VM에서 FUSE mount되어 있음
      # /gcs 경로는 VM에서 gcsfuse로 마운트되어 있어야 함
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
