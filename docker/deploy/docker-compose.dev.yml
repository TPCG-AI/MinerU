# ====================================
# MinerU 개발용 Docker Compose
# 로컬 소스 실시간 반영
# 사용법: docker compose -f docker-compose.dev.yml up
# ====================================

services:
  mineru-api:
    build:
      context: ../..
      dockerfile: docker/deploy/Dockerfile
    image: mineru-dev:latest
    container_name: mineru-dev-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MINERU_MODEL_SOURCE: local
      PORT: 8080
    # Cloud Run용 entrypoint.sh 무시하고 직접 실행
    command: >
      mineru-api
      --host 0.0.0.0
      --port 8080
      --backend vlm-vllm-async-engine
      --model /gcs/vlm
      --gpu-memory-utilization 0.5
    volumes:
      # 로컬 소스 코드 실시간 반영 (editable mode)
      - ../../mineru:/workspace/mineru/mineru:rw
      # GCS 버킷 마운트 (VM의 /gcs를 컨테이너로 전달)
      - /gcs:/gcs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
